# copyright needs to stay in sync with message in About panel in background.ts
copyright: Copyright © 2021-2026 SUSE LLC
productName: Rancher Desktop 2
icon: ./resources/icons/logo-square-512.png
appId: io.rancherdesktop.app2
asar: true
asarUnpack:
- '**/*.node'
electronLanguages: [ en-US ]
extraResources:
- from: resources/
  filter:
  - '!host/**'
  - '!**/*.unsigned'
  - '!**/*.tar.gz'
  - '!**/*.tgz'
  - '!**/*.xz'
  - '!**/*.zip'
  - '!**/*-release.png' # icon masters; prepareIcons() generates the shipped names
  - '!**/*-prerelease.png'
files:
- dist/app/**/*
- '!**/node_modules/*/prebuilds/!(${platform}*)/*.node'
mac:
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  icon: ./resources/icons/mac-icon.png
  target: [ dmg, zip ]
  identity: ~ # We sign in a separate step
  extraResources:
  - { from: rdd/bin, to: darwin/bin/, filter: [ rdd ] }
  extraFiles:
  - { from: dist/signing-config-mac.yaml, to: build/signing-config-mac.yaml }
  - { from: dist/electron-builder.yaml, to: electron-builder.yml }
dmg:
  # title is set programmatically in scripts/package.ts so we can include the
  # architecture (electron-builder's title macros don't expose ${arch}).
  background: build/background.png
  window:
    width: 540
    # Taller than the artwork so the lasso clears the Finder path bar and
    # status bar, which shrink the icon view from the bottom when enabled.
    height: 420
  contents:
  - { x: 140, y: 200, type: file }
  - { x: 400, y: 200, type: link, path: /Applications }
  iconSize: 100
  iconTextSize: 14
win:
  # `yarn package` (e.g. CI's build on every commit to main) builds an
  # unsigned .appx alongside the .zip, using the options in the `appx:`
  # section below, so it can be installed on QA machines without waiting for
  # a release. Only the .zip is signed later: release builds re-sign the
  # files inside it and rebuild a *signed* .appx from that signed unpacked
  # app via `electron-builder --prepackaged` (scripts/lib/sign-win32.ts),
  # since that is the only point a real certificate (CSC_FINGERPRINT) is
  # available to derive the appx Publisher identity from (see below).
  #
  # Note: this is the APPX packaging format, not MSIX -- electron-builder
  # 26.x only has an `appx` target (it hardcodes the output file extension
  # to .appx regardless of config). APPX and MSIX share the same manifest
  # schema and install mechanism (Add-AppxPackage/PackageManager), so the
  # custom manifest below still works unmodified.
  target: [ zip, appx ]
  signtoolOptions:
    signingHashAlgorithms: [ sha256 ] # We only support Windows 10 + WSL2
  requestedExecutionLevel: asInvoker # The _app_ doesn't need privileges
  extraResources:
  - { from: rdd/bin, to: windows/bin/, filter: [ rdd.exe, rdd-forwarder.exe ] }
  extraFiles:
  - { from: dist/signing-config-win.yaml, to: build/signing-config-win.yaml }
  - { from: dist/electron-builder.yaml, to: electron-builder.yml }
appx:
  # Override publisher with the test OID for installing unsigned packages.
  # See https://learn.microsoft.com/en-us/windows/msix/package/unsigned-package
  publisher: >-
    CN=Rancher Desktop Test Publisher,
    OID.2.25.311729368913984317654407730594956997722=1
  publisherDisplayName: The Rancher Desktop Authors
  identityName: io.rancherdesktop.app2
  displayName: Rancher Desktop 2
  # unvirtualizedResources is needed so the custom manifest's <Properties>
  # virtualization exclusions (declared in build/appx/appxmanifest.xml) take
  # effect. Store approval is not required for sideloaded apps that declare
  # restricted capabilities.
  capabilities: [ runFullTrust, unvirtualizedResources ]
  customManifestPath: appx/appxmanifest.xml
  # No addAutoLaunchExtension: RDD (the background service), not the Electron
  # app, owns the user-togglable start-at-login behavior, so there is no need
  # for a UWP StartupTask extension or electron-winstore-auto-launch here.
  # Windows 10 1903+ is required for the unvirtualizedResources capability.
  minVersion: 10.0.18362.0
linux:
  category: Utility
  # Also names the .desktop file and its icon, so it must differ from
  # Rancher Desktop 1 for parallel installs.
  executableName: rancher-desktop-2
  extraResources:
  - { from: rdd/bin, to: linux/bin/, filter: [ rdd ] }
  target: [ zip ]
publish:
  provider: custom
  upgradeServer: https://desktop.version.rancher.io/v1/checkupgrade
  vPrefixedTagName: true
