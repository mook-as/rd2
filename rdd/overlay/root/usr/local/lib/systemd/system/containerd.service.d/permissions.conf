# Lima forwards guest sockets over SSH as an unprivileged user, but containerd
# creates /run/containerd/containerd.sock and its parent directories
# root-only. Grant access like docker.service.d/permissions.conf does for
# docker.sock. The `-` prefixes keep a failed chmod from taking containerd down
# with it.

[Service]
ExecStartPost=-chmod a+x /run/containerd
ExecStartPost=-chmod a+rw /run/containerd/containerd.sock
